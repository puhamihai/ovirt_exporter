on:
  push:
    tags:
      - "v*.*.*"

name: Release

# GoReleaser creates the release and uploads the artifacts.
permissions:
  contents: write

jobs:
  goreleaser:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Required by GoReleaser - it needs the full commit history and tags
          # to build the changelog. actions/checkout defaults to a shallow
          # clone, which silently truncates it.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
