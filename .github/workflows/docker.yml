name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

# Pull requests only build the image. Pushes to main and version tags publish
# it to ghcr.io/<owner>/ovirt_exporter with the workflow token. No Docker Hub
# image is set, so no Docker Hub credentials are needed. The reusable job asks
# for these permissions, and a caller can only grant what it has itself.
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  docker:
    uses: czerwonk/go-ci/.github/workflows/docker-publish.yml@v1
